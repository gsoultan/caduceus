name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: '1.27.4'

jobs:
  check:
    name: Format, vet, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"; echo "$unformatted"; exit 1
          fi
      # The benchmarks are a module of their own, so vet them separately.
      - run: go vet ./... && (cd benchmarks && go vet ./...) && (cd gss && go vet ./...)
      - name: The core module requires nothing
        run: |
          if grep -q '^require' go.mod; then
            echo "::error::caduceus must not depend on any module"; exit 1
          fi
      - run: go test -race -count=1 ./... && (cd gss && go test -race -count=1 ./...)

  # Linux is where the live tests run; these build and run the unit tests
  # where the kernel differs, for the code with a file per system: the read
  # watermark, peeking at the socket, peer credentials and TCP_USER_TIMEOUT.
  systems:
    name: Unit tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go vet ./...
      - run: go test -count=1 ./...

  # Every parser that reads what comes off the network, and the connection
  # string, fuzzed for a short while on each change. A finding is saved under
  # testdata/fuzz, which the unit tests then replay.
  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - ./codec FuzzScan
          - ./codec FuzzParseDecimalFast
          - ./replication FuzzDecode
          - ./wire FuzzParseBackendMessages
          - ./wire FuzzParseConfig
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Fuzz for a minute
        run: |
          set -- ${{ matrix.target }}
          go test -run='^$' -fuzz="^$2\$" -fuzztime=60s "$1"

  live:
    name: Against PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        postgres: ['14', '17', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      # The replication tests need logical decoding and a replication
      # connection, which the image allows neither of: wal_level is replica and
      # pg_hba.conf's "all" does not cover replication. A service container
      # takes no server arguments, so both are set here and the server restarted.
      - name: Allow logical replication
        run: |
          id=${{ job.services.postgres.id }}
          docker exec "$id" psql -U postgres -c "ALTER SYSTEM SET wal_level = logical"
          docker exec "$id" sh -c 'echo "host replication all all scram-sha-256" >> "$PGDATA/pg_hba.conf"'
          docker restart "$id"
          until docker exec "$id" pg_isready -U postgres; do sleep 1; done
      - run: go test -race -count=1 ./...
      # A smoke run: that every contender still runs each workload. A hundred
      # iterations keep the slow ones, a thousand inserts through database/sql,
      # to seconds; the numbers in the README come from 3-second runs.
      - name: Benchmarks against pgx, database/sql and lib/pq
        run: cd benchmarks && go test -run='^$' -bench=. -benchtime=100x ./...
